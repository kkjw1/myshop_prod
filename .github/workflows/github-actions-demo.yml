name: Deploy to OCI

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 웹 UI 수동 실행 허용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: |
          ./gradlew clean bootJar
          mv build/libs/app.jar build/libs/app-new.jar


      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/libs/app-new.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: Swap jar and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            mv /home/ubuntu/app/app-new.jar /home/ubuntu/app/app.jar
            sudo systemctl restart myshop